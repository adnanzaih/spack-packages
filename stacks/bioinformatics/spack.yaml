# This is a Spack Environment file.
#
# It describes a set of packages to be installed, along with
# configuration settings.
spack:
  config:
    install_tree:
      root: /sw/spack/bioinformatics/opt/pkgs
  upstreams:
    arc-compiler-stacks:
      install_tree: /sw/spack/opt/pkgs
  view: false
  specs:
  ##########################################################################################
  #                                       Software                                         #
  ##########################################################################################
  - group: bioinformatics
    specs:
    - bamtools
    - bcftools
    - beast1 ^libbeagle ^openjdk
    - bedtools2 ^python@3.13.13+arc
    - diamond ^blast-plus cxxflags="-fcoroutines" ^python@3.13.13+arc 
    - blast2go ^blast-plus cxxflags="-fcoroutines"
    - rseurat
    - rseurat ^r@4.6.0
    #- dorado@0.9.6 %llvm ^cuda
    #- dorado@1.0.2 %llvm ^cuda
    - elastix@5.2.0
    # - blat
    # - bowtie
    # - bowtie2
    # - bwa
    # - cairo
    # - canu
    # - cap3
    # - clustal-omega
    # - cufflinks
    # - delly2
    # - fastqc
    # - figtree
    # - gatk
    # - gdk-pixbuf
    # - gnuplot
    # - harfbuzz
    # - hisat2
    # - hmmer
    # - homer
    # - htslib
    # - igv
    # - imagemagick
    # - impute2
    # - itk
    # - jellyfish
    # - libxft
    # - masurca
    # - minimap2
    # - mothur
    # - ncftp
    # - neuron
    # - nextflow
    # - openslide
    # - pango
    # - pdf2svg
    # - poppler
    # - raxml
    # - rmats
    # - rsem
    # - salmon
    # - samtools
    # - seqkit
    # - spades
    # - sratoolkit
    # - star
    # - stringtie
    # - trimgalore
    override:
      packages:
        apr-util:
          prefer:
          - '~crypto'
  concretizer:
    unify: false
    reuse: true
    compiler_mixing: true
    ##########################################################################################
    #                                         Modules                                        #
    ##########################################################################################
  modules:
    default:
      roots:
        lmod: /sw/spack/bioinformatics/opt/modules
        tcl: /sw/spack/bioinformatics/opt/modules
      lmod:
        projections:
          r: 'R/{version}'
          hdf5~threadsafe: 'hdf5/{version}-nonatomic'
          intel-oneapi-compilers-classic: 'intel/{version}'
          miniforge3: 'mamba/{version}'
          py-mpi4py: 'mpi4py/{version}' 
          rseurat: "rseurat/{version}-R-{^r.version}"
        hash_length: 0
        core_compilers:
        - gcc@14.3.1
        - oneapi
        hierarchy: []
        core_specs:
        - gcc@14.3.1
        - gcc-runtime@14.3.1
        exclude:
        - gcc-runtime@14.3.1
        - glibc
        - autoconf
        - compiler-wrapper
        gcc-runtime:
          template: gcc-runtime.lua
