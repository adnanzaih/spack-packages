# This is a Spack Environment file.
#
# It describes a set of packages to be installed, along with
# configuration settings.
spack:
  config:
    install_tree:
      root: /sw/spack/bioinformatics/opt/pkgs
  mirrors:
      buildcache: file:///sw/spack/buildcache
  upstreams:
    arc-compiler-stacks:
      install_tree: /sw/spack/opt/pkgs
      modules:
        lmod: /sw/spack/opt/modules
  view: false
  specs:
  ##########################################################################################
  #                                       Software                                         #
  ##########################################################################################
  - group: bioinformatics
    specs:
    - bamtools
    - bcftools
    - beast1
    - bedtools2 ^python@3.13.13+arc
    - blast-plus@2.17.0+sqlite
    - scons
    - diamond ^blast-plus@2.17.0+sqlite cxxflags="-fcoroutines" ^python@3.13.13+arc
    - blast2go ^blast-plus@2.17.0+sqlite cxxflags="-fcoroutines"
    - dorado@2.1
    - rseurat@5.5.1 ^r@4.6.1/hsmq64i
    - elastix@5.2.0
    - plink2
    - gatk@4.5.0.0+r ^r/hsmq64i
    - mothur@1.48.0+boost+gsl+hdf5 ^usearch@12 ^boost@1.80
    - rdeseq2@1.52
    - rsem ^zlib
    - bowtie
    - bowtie2
    - star
    - seqtk@1.4
    - sortmerna
    - sratoolkit@3.4.1
    - stringtie@3.0.3
    - stringtie@2.2.1
    - itk@5.4.4
    - hmmer ^gcc/o4xno4x
    - fasttree ^gcc/o4xno4x
    - trimmomatic
    - tabix
    - kallisto
    - mafft
    - mrbayes~mpi
    - sage ^rust@1.97.1
    - spades cxxflags="-mno-avx512f" ^python+arc ^aocc
    - subread
    - picard
    - vcftools
    - exonerate
    - py-quast
    - glimmer
    - mummer
    - py-nanoplot
    override:
      packages:
        c:
          prefer: [gcc@14.3.1]
        cxx:
          prefer: [gcc@14.3.1]
        fortran:
          prefer: [gcc@14.3.1]
        apr-util:
          prefer:
          - '~crypto'    
  concretizer:
    unify: false
    reuse: true
    compiler_mixing: true
    ##########################################################################################
    #                                         Modules                                        #
    ##########################################################################################
  modules:
    default:
      roots:
        lmod: /sw/spack/bioinformatics/opt/modules
        tcl: /sw/spack/bioinformatics/opt/modules
      lmod:
        hide_implicits: true
        projections:
          r: 'R/{version}'
          hdf5~threadsafe: 'hdf5/{version}-nonatomic'
          intel-oneapi-compilers-classic: 'intel/{version}'
          miniforge3: 'mamba/{version}'
          py-mpi4py: 'mpi4py/{version}'
          rseurat: "rseurat/{version}-R-{^r.version}"
        hash_length: 0
        core_compilers:
        - gcc@14.3.1
        - aocc
        - oneapi
        - llvm
        hierarchy:: []
        core_specs:
        - gcc@14.3.1
        - gcc-runtime@14.3.1
        exclude:
        - gcc-runtime@14.3.1
        - glibc
        - autoconf
        - compiler-wrapper
        - compiler-wrapper
        - util-macros
        - py-pip
        - py-setuptools
        - py-wheel
        - py-cython
        - python-venv
        gcc-runtime:
          template: gcc-runtime.lua
