# This is a Spack Environment file.
#
# It describes a set of packages to be installed, along with
# configuration settings.
spack:
  config:
      install_tree:
        root: /sw/pkgs/arc/staging/qupath
  upstreams:
    arc-compiler-stacks:
      install_tree: /sw/pkgs/arc/staging/spack
  view: false
  specs:
  ##########################################################################################
  #                                       Software                                         #
  ##########################################################################################

  - group: qupath
    specs:
    - qupath@0.7.0+djl+pytorch torch_version=2.7.1 ^openjdk@25
    override:
      packages:
        c:
          prefer: [gcc@14]
        cxx:
          prefer: [gcc@14]
        fortran:
          prefer: [gcc@14]
  concretizer:
    unify: true
    reuse: true
  packages:
  ##########################################################################################
  #                                       Compilers                                        #
  ##########################################################################################
    all:
      providers:
        java: [openjdk]
    gcc:
      externals:
      - spec: gcc@14 languages:='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc
            cxx: /usr/bin/g++
            fortran: /usr/bin/gfortran
    ##########################################################################################
    #                                       Externals                                        #
    ##########################################################################################

    perl:
      externals:
      - spec: perl@5.40
        prefix: /usr
    icu4c:
      buildable: false
      externals:
      - spec: icu4c@74
        prefix: /usr
    autoconf:
      buildable: false
      externals:
      - spec: autoconf@2.71
        prefix: /usr
    pkgconf:
      buildable: false
      externals:
      - spec: pkgconf@2
        prefix: /usr
    bash:
      buildable: false
      externals:
      - spec: bash@5.2
        prefix: /usr
    git:
      buildable: false
      externals:
      - spec: git@2.52
        prefix: /usr
    openssl:
      buildable: false
      externals:
      - spec: openssl@3.5
        prefix: /usr

    ##########################################################################################
    #                                         Modules                                        #
    ##########################################################################################

  modules:
    default:
      roots:
        lmod: /sw/pkgs/arc/staging/qupath/modules
        tcl: /sw/pkgs/arc/staging/qupath/modules
      lmod:
        projections:
          r: 'R/{version}'
          hdf5~threadsafe: 'hdf5/{version}-nonatomic'
          intel-oneapi-compilers-classic: 'intel/{version}'
          miniforge3: 'mamba/{version}'
          py-mpi4py: 'mpi4py/{version}'
        hash_length: 0
        hierarchy: []
        core_specs:
        - gcc@14
        - gcc-runtime@14
        exclude:
        - gcc-runtime@14
        - glibc
        - autoconf
        - compiler-wrapper
        gcc-runtime:
          template: gcc-runtime.lua
