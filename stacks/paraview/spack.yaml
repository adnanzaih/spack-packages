# This is a Spack Environment file.
#
# It describes a set of packages to be installed, along with
# configuration settings.
spack:
  config:
      install_tree:
        root: /sw/spack/opt/pkgs
  view: false
  specs:
  ##########################################################################################
  #                                       Software                                         #
  ##########################################################################################
  - group: paraview
    specs:
    - paraview@6.1.1+cuda+mpi+qt+raytracing+hdf5 cuda_arch=80 ^ninja@1.13.2 ^python/c3sfkjb ^meson@1.11.1
    - paraview@6.1.1~cuda~mpi+qt+raytracing+hdf5 ^ninja@1.13.2 ^python/c3sfkjb ^meson@1.11.1
  concretizer:
    unify: false
    reuse: true
    ##########################################################################################
    #                                         Modules                                        #
    ##########################################################################################
  modules:
    default:
      roots:
        lmod: /sw/spack/opt/modules
        tcl: /sw/spack/opt/modules
      lmod:
        projections:
          r: 'R/{version}'
          hdf5~threadsafe: 'hdf5/{version}-nonatomic'
          intel-oneapi-compilers-classic: 'intel/{version}'
          miniforge3: 'mamba/{version}'
          py-mpi4py: 'mpi4py/{version}'
          intel-oneapi-mpi: 'impi/{version}'
          gh: 'github-cli/{version}'
          paraview~mpi~cuda: 'paraview/{version}-nompicuda'
        hash_length: 0
        all:
          suffixes:
            'binutils target=x86_64': x86_64
            'gmp target=x86_64': x86_64
            'mpc target=x86_64': x86_64
            'mpfr target=x86_64': x86_64
            'zlib-ng target=x86_64': x86_64
            'zstd target=x86_64': x86_64
        core_compilers:
          - gcc@14.3.1
        hierarchy:
          - r
          - mpi
        core_specs:
        - gcc@14.3.1
        - gcc-runtime@14.3.1
        exclude:
        - gcc-runtime@14.3.1
        - glibc
        - autoconf
        - compiler-wrapper
        - util-macros
        - py-pip
        - py-setuptools
        - py-wheel
        - py-cython
        - python-venv
        gcc-runtime:
          template: gcc-runtime.lua
        miniforge3:
          environment:
            set:
              CONDA_ENVS_PATH: "~/.conda/envs"
              CONDA_PKGS_DIRS: "~/.conda/pkgs"
        openmpi@5.0.10+arc:
          environment:
            set:
              UCX_LOG_LEVEL: error
        intel-oneapi-mpi@2021.18.0:
          environment:
            set:
              SLURM_MPI_TYPE: pmi2
              I_MPI_HYDRA_BOOSTRAP: slurm
              I_MPI_PMI_LIBRARY: /usr/lib64/libpmi2.so
        aocc@5.2.0:
          environment:
            prepend_path:
              MODULEPATH: /sw/spack/chemistry/opt/modules/linux-rhel10-x86_64/aocc/5.2.0
