# This is a Spack Environment file.
#
# It describes a set of packages to be installed, along with
# configuration settings.
spack:
  view: false
  specs:
  ##########################################################################################
  #                                       Software                                         #
  ##########################################################################################

  - group: gcc-8
    specs:
    - python@3.9.25+arc
    - python@3.10.20+arc
    - python@3.11.15+arc
    - python@3.12.13+arc
    - python@3.13.13+arc
    - boost@1.78.0
    - geos@3.14.1
    - openmpi@5.0.10+arc
    - openblas
    - netlib-lapack
    #- flexiblas %gcc@8.5.0
    - libaec@1.1.4
    - proj@9.7.0
    - gdal@3.6.3 ^netcdf-c@4.7.4 ^hdf5@1.14.6+hl+cxx+fortran
    - hdf5@1.14.6+hl+cxx+fortran
    - libjpeg-turbo@3.1.3
    - libtiff@4.7.1
    - netcdf-c@4.7.4 ^hdf5@1.14.6+hl+cxx+fortran
    - netcdf-cxx4@4.3.1 ^netcdf-c@4.7.4 ^hdf5@1.14.6+hl+cxx+fortran
    - netcdf-fortran@4.6.2 ^netcdf-c@4.7.4 ^hdf5@1.14.6+hl+cxx+fortran
    - sqlite@3.53.1
    - archivetar@0.18.2 ^python@3.13.13+arc ^openmpi@5.0.10+arc
    - libsodium@1.0.22
    - libgd@2.3.3
    - r+arc ^flexiblas ^jpeg ^libtiff ^libpng
    override:
      packages:
        c:
          prefer: [gcc@8.5.0]
        cxx:
          prefer: [gcc@8.5.0]
        fortran:
          prefer: [gcc@8.5.0]
  - group: gcc-15.1.0
    specs:
    - python@3.9.25+arc
    - python@3.10.20+arc
    - python@3.11.15+arc
    - python@3.12.13+arc
    - python@3.13.13+arc
    - boost@1.78.0
    - geos@3.14.1
    - openmpi@5.0.10+arc
    - openblas
    - netlib-lapack
    #- flexiblas %gcc@15.1.0
    - libaec@1.1.4
    - proj@9.7.0
    - gdal@3.13.1 ^netcdf-c@4.10.0 ^hdf5@1.14.6+hl+cxx+fortran
    - hdf5@1.14.6+hl+cxx+fortran
    - libjpeg-turbo@3.1.3
    - libtiff@4.7.1
    - netcdf-c@4.10.0 ^hdf5@1.14.6+hl+cxx+fortran
    - netcdf-cxx4@4.3.1 ^netcdf-c@4.10.0 ^hdf5@1.14.6+hl+cxx+fortran
    - netcdf-fortran@4.6.2 ^netcdf-c@4.10.0 ^hdf5@1.14.6+hl+cxx+fortran
    - sqlite@3.53.1
    #- lwgrp@1.0.6
    #- archivetar@0.18.2 ^python@3.13.13+arc ^openmpi@5.0.10+arc
    - libsodium@1.0.22
    - libgd@2.3.3
    override:
        packages:
          c:
            prefer: [gcc@15.1.0]
          cxx:
            prefer: [gcc@15.1.0]
          fortran:
            prefer: [gcc@15.1.0]
  - group: gcc-10.3.0
    specs:
    - python@3.9.25+arc
    - python@3.10.20+arc
    - python@3.11.15+arc
    - python@3.12.13+arc
    - python@3.13.13+arc
    - boost@1.78.0
    - geos@3.14.1
    - openmpi@5.0.10+arc
    - openblas
    - netlib-lapack
    #- flexiblas %gcc@10.3.0
    - libaec@1.1.4
    - proj@9.7.0
    - gdal@3.13.1 ^netcdf-c@4.10.0 ^hdf5@1.14.6+hl+cxx+fortran
    - hdf5@1.14.6+hl+cxx+fortran
    - libjpeg-turbo@3.1.3
    - libtiff@4.7.1
    - netcdf-c@4.10.0 ^hdf5@1.14.6+hl+cxx+fortran
    - netcdf-cxx4@4.3.1 ^netcdf-c@4.10.0 ^hdf5@1.14.6+hl+cxx+fortran
    - netcdf-fortran@4.6.2 ^netcdf-c@4.10.0 ^hdf5@1.14.6+hl+cxx+fortran
    - sqlite@3.53.1
    - libsodium@1.0.22
    override:
        packages:
          c:
            prefer: [gcc@10.3.0]
          cxx:
            prefer: [gcc@10.3.0]
          fortran:
            prefer: [gcc@10.3.0]
  - group: llvm-22.1.3
    specs:
    - boost@1.88.0
    - geos@3.14.1
    - openmpi@5.0.10+arc
    - openblas
    - netlib-lapack
    #- flexiblas %llvm@22.1.3
    - libaec@1.1.4
    - proj@9.7.0
    #- gdal@3.13.1 ^netcdf-c ^hdf5+hl+cxx+fortran
    - hdf5@1.14.6+hl+cxx+fortran
    - libjpeg-turbo@3.1.3
    - libtiff@4.7.1
    - netcdf-c@4.10.0 ^hdf5@1.14.6+hl+cxx+fortran
    - netcdf-cxx4@4.3.1 ^netcdf-c@4.10.0 ^hdf5@1.14.6+hl+cxx+fortran
    - netcdf-fortran@4.6.2 ^netcdf-c@4.10.0 ^hdf5@1.14.6+hl+cxx+fortran
    - sqlite@3.53.1
    - libsodium@1.0.22
    override:
        packages:
          c:
            prefer: [llvm@22.1.3]
          cxx:
            prefer: [llvm@22.1.3]
          fortran:
            prefer: [llvm@22.1.3]
  - group: intel-classic-compiler
    specs:
    - boost@1.78.0
    - openmpi@5.0.10+arc
    - openblas
    - netlib-lapack
    #- flexiblas
    - fftw@3.3.11~mpi
    - libaec@1.1.4 %intel-oneapi-compilers-classic@2021.5.0
    - hdf5@1.14.6+hl+cxx+fortran
    - netcdf-c@4.10.0 ^hdf5@1.14.6+hl+cxx+fortran
    - netcdf-cxx4@4.3.1 ^netcdf-c@4.10.0 ^hdf5@1.14.6+hl+cxx+fortran
    - netcdf-fortran@4.6.2 ^netcdf-c@4.10.0 ^hdf5@1.14.6+hl+cxx+fortran
    - libsodium@1.0.22
    override:
        packages:
          c:
            prefer: [intel-oneapi-compilers-classic@2021.5.0]
          cxx:
            prefer: [intel-oneapi-compilers-classic@2021.5.0]
          fortran:
            prefer: [intel-oneapi-compilers-classic@2021.5.0]
  concretizer:
    unify: false
    reuse: true
  packages:
  ##########################################################################################
  #                                       Compilers                                        #
  ##########################################################################################
  
    gcc:
      externals:
      - spec: gcc@8.5.0 languages:='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc
            cxx: /usr/bin/g++
            fortran: /usr/bin/gfortran
      - spec: gcc@10.3.0 languages:='c,c++,fortran'
        prefix: /sw/pkgs/arc/gcc/10.3.0
        extra_attributes:
          compilers:
            c: /sw/pkgs/arc/gcc/10.3.0/bin/gcc
            cxx: /sw/pkgs/arc/gcc/10.3.0/bin/g++
            fortran: /sw/pkgs/arc/gcc/10.3.0/bin/gfortran
      - spec: gcc@15.1.0 languages:='c,c++,fortran'
        prefix: /sw/pkgs/arc/gcc/15.1.0
        extra_attributes:
          compilers:
            c: /sw/pkgs/arc/gcc/15.1.0/bin/gcc
            cxx: /sw/pkgs/arc/gcc/15.1.0/bin/g++
            fortran: /sw/pkgs/arc/gcc/15.1.0/bin/gfortran
    llvm:
      externals:
      - spec: llvm@22.1.3+flang openmp=runtime
        prefix: /sw/pkgs/arc/llvm/22.1.3
        extra_attributes:
          compilers:
            c: /sw/pkgs/arc/llvm/22.1.3/bin/clang
            cxx: /sw/pkgs/arc/llvm/22.1.3/bin/clang++
            fortran: /sw/pkgs/arc/llvm/22.1.3/bin/flang
          extra_rpaths:
          - /sw/pkgs/arc/llvm/22.1.3/lib/x86_64-unknown-linux-gnu/
          environment:
                  prepend_path:
                          LD_LIBRARY_PATH: /sw/pkgs/arc/llvm/22.1.3/lib/x86_64-unknown-linux-gnu/
    intel-oneapi-compilers-classic:
      externals:
      - spec: intel-oneapi-compilers-classic@2021.5.0
        prefix: /sw/pkgs/arc/intel/2022.1.2/compiler/2022.0.2/linux
        extra_attributes:
          compilers:
            c: /sw/pkgs/arc/intel/2022.1.2/compiler/2022.0.2/linux/bin/intel64/icc
            cxx: /sw/pkgs/arc/intel/2022.1.2/compiler/2022.0.2/linux/bin/intel64/icpc
            fortran: /sw/pkgs/arc/intel/2022.1.2/compiler/2022.0.2/linux/bin/intel64/ifort
          flags:
            ldflags: -L/sw/pkgs/arc/intel/2022.1.2/compiler/2022.0.2/linux/compiler/lib/intel64_lin/
          extra_rpaths:
          - /sw/pkgs/arc/intel/2022.1.2/compiler/2022.0.2/linux/compiler/lib/intel64_lin/
          environment:
            prepend_path:
              LD_LIBRARY_PATH: /sw/pkgs/arc/intel/2022.1.2/compiler/2022.0.2/linux/compiler/lib/intel64_lin/

    ##########################################################################################
    #                                       Externals                                        #
    ##########################################################################################

    perl:
      externals:
      - spec: perl@5.26.3
        prefix: /usr
    icu4c:
      buildable: false
      externals:
      - spec: icu4c@60.3
        prefix: /usr
    ##########################################################################################
    #                                         Modules                                        #
    ##########################################################################################

  modules:
    default:
      lmod:
        projections:
          r: 'R/{version}'
        hash_length: 0
        core_compilers:
        - gcc@8.5.0/w6akmqjjogstolgcqh5loghofzx54fk5
        core_specs:
        - gcc@8.5.0
        - gcc-runtime@8.5.0
        - gcc@10.3.0
        - gcc@15.1.0
        - llvm@22.1.3
        - intel-oneapi-compilers-classic@2021.5.0
        exclude:
        - gcc-runtime@8.5.0
        - glibc
