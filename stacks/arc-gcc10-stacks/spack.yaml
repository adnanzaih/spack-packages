# This is a Spack Environment file.
#
# It describes a set of packages to be installed, along with
# configuration settings.
spack:
  config:
      install_tree:
        root: /sw/pkgs/arc/staging/spack
  view: false
  specs:
  ##########################################################################################
  #                                       Software                                         #
  ##########################################################################################

  - group: gcc-10.3.0
    specs:
    - python@3.13.13
    - python@3.9.24
    - python@3.10.19
    - armadillo ^flexiblas
    - flexiblas@3.4.2
    - boost@1.78.0~mpi
    - boost@1.90.0~mpi
    - geos@3.14.1
    - openmpi@5.0.10
    - openblas@0.3.33
    - openjdk@18.0.1.1
    - netlib-lapack@3.12.1
    - libaec@1.1.4
    - proj@9.7.0
    - hdf5@1.14.6+threadsafe ^libaec@1.1.4
    - netcdf-c@4.9.2+blosc+hdf4+mpi+parallel-netcdf+szip+zstd
    - netcdf-cxx4 
    - netcdf-fortran
    - libjpeg-turbo@3.1.3
    - libtiff@4.7.1
    - sqlite@3.53.1
    - archivetar@0.18.2 ^python@3.13.13 ^openmpi@5.0.10
    - libsodium@1.0.22
    - libgd@2.3.3
    - r@4.6.1
    - r@4.6.0
    - r@4.5.3
    - mumps +complex+double+float+metis+parmetis+scotch+mpi
    - gsl
    - ffmpeg@8.1 +gpl +version3 +nonfree +shared +libmp3lame +libopus +libvorbis +libvpx +libx264 +openssl
    override:
      packages:
        c:
          prefer: [gcc@10.3.0]
        cxx:
          prefer: [gcc@10.3.0]
        fortran:
          prefer: [gcc@10.3.0]
        python:
          require:
          - "+arc"
        openmpi:
          require:
          - "+arc"
        r:
          require:
          - "+arc+X"
        hdf5:
          prefer:
          - "+cxx+fortran+hl+mpi"
        boost:
          prefer:
          - "~mpi"
  concretizer:
    unify: false
    reuse: true
  packages:
    all:
      providers:
        java: [openjdk]
  ##########################################################################################
  #                                       Compilers                                        #
  ##########################################################################################
    gcc:
      externals:
      - spec: gcc@10.3.0 languages:='c,c++,fortran'
        prefix: /sw/pkgs/arc/gcc/10.3.0
        extra_attributes:
          compilers:
            c: /sw/pkgs/arc/gcc/10.3.0/bin/gcc
            cxx: /sw/pkgs/arc/gcc/10.3.0/bin/g++
            fortran: /sw/pkgs/arc/gcc/10.3.0/bin/gfortran
    ##########################################################################################
    #                                       Externals                                        #
    ##########################################################################################
    perl:
      externals:
      - spec: perl@5.26.3
        prefix: /usr
    icu4c:
      buildable: false
      externals:
      - spec: icu4c@60.3
        prefix: /usr
    openjdk:
      buildable: false
      externals:
      - spec: openjdk@1.8.0
        prefix: /usr/lib/jvm/jre
      - spec: openjdk@18.0.1.1
        prefix: /sw/pkgs/arc/openjdk/jdk-18.0.1.1
    autoconf:
      buildable: false
      externals:
      - spec: autoconf@2.69
        prefix: /usr
    pkgconf:
      buildable: false
      externals:
      - spec: pkgconf@2.5.1
        prefix: /usr
    openssl:
      buildable: false
      externals:
      - spec: openssl@1.1.1
        prefix: /usr
    tar:
      buildable: false
      externals:
      - spec: tar@1.30
        prefix: /usr
    curl:
      buildable: true
      externals:
      - spec: curl@7.61.1
        prefix: /usr
    expat:
      buildable: false
      externals:
      - spec: expat@2.5.0
        prefix: /usr
    json-c:
      buildable: True
      externals:
      - spec: json-c@0.13.1
        prefix: /usr
    readline:
      buildable: false
      externals:
      - spec: readline@7.0
        prefix: /usr
    hwloc:
      buildable: false
      externals:
      - spec: hwloc@2.1.0
        prefix: /usr
    pmix:
      buildable: false
      externals:
      - spec: pmix@5.0.10
        prefix: /opt/pmix/5.0.10
    fribidi:
      buildable: false
      externals:
      - spec: fribidi@1.0.4
        prefix: /usr
    libxcb:
      buildable: false
      externals:
      - spec: libxcb@1.13.1
        prefix: /usr
    ##########################################################################################
    #                                         Modules                                        #
    ##########################################################################################
  modules:
    default:
      roots:
        lmod: /sw/pkgs/arc/staging/spack/modules
        tcl: /sw/pkgs/arc/staging/spack/modules
      lmod:
        projections:
          r: 'R/{version}'
          hdf5~threadsafe: 'hdf5/{version}-nonatomic'
          intel-oneapi-compilers-classic: 'intel/{version}'
        hash_length: 0
        core_compilers:
          - gcc@8.5.0
        hierarchy:
          - r
          - mpi
        core_specs:
        - gcc@8.5.0
        - gcc-runtime@8.5.0
        - gcc@10.3.0
        - gcc@15.1.0
        - llvm@22.1.3
        - intel-oneapi-compilers-classic@2021.5.0
        exclude:
        - gcc-runtime@8.5.0
        - glibc
        - autoconf
        - compiler-wrapper
        - util-macros
        gcc-runtime:
          template: gcc-runtime.lua
