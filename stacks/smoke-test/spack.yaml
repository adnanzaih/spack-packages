# This is a Spack Environment file.
#
# It describes a set of packages to be installed, along with
# configuration settings.
spack:
  config:
    install_tree:
      root: /sw/pkgs/arc/staging/spack
  upstreams:
    arc-compiler-stacks:
      install_tree: /sw/pkgs/arc/staging/spack
  view: false
  specs:
  ##########################################################################################
  #                                       Software                                         #
  ##########################################################################################
  - group: test
    specs:
    - build-link-test ^netcdf-c@4.7.4~mpi~parallel-netcdf~hdf4 ^hdf5@1.14.6+cxx+fortran+hl~ipo~java~map~mpi+shared+szip~threadsafe+tools ^libaec@1.1.4
    override:
      packages:
        c:
          prefer: [gcc@14]
        cxx:
          prefer: [gcc@14]
        fortran:
          prefer: [gcc@14]
        pkgconf:
          require:
            - "target=x86_64"
  concretizer:
    unify: false
    reuse: true
  packages:
    perl:
      externals:
      - spec: perl@5.40
        prefix: /usr
    icu4c:
      buildable: false
      externals:
      - spec: icu4c@74
        prefix: /usr
    autoconf:
      buildable: false
      externals:
      - spec: autoconf@2.71
        prefix: /usr
    pkgconf:
      buildable: false
      externals:
      - spec: pkgconf@2
        prefix: /usr
    openssl:
      buildable: false
      externals:
      - spec: openssl@3.5
        prefix: /usr
    tar:
      buildable: false
      externals:
      - spec: tar@1
        prefix: /usr
  modules:
    default:
      roots:
        lmod: /sw/pkgs/arc/staging/spack/modules
        tcl: /sw/pkgs/arc/staging/spack/modules
      lmod:
        projections:
          r: 'R/{version}'
          intel-oneapi-compilers-classic: 'intel/{version}'
        hash_length: 0
        hierarchy:
          - r
          - mpi
        core_specs:
        - gcc@14
        - gcc-runtime@14
        exclude:
        - gcc-runtime@14
        - glibc
        - autoconf
        - compiler-wrapper
        - util-macros
