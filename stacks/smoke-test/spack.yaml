# This is a Spack Environment file.
#
# It describes a set of packages to be installed, along with
# configuration settings.
spack:
  config:
    install_tree:
      root: /sw/pkgs/arc/staging/spack
  upstreams:
    arc-compiler-stacks:
      install_tree: /sw/pkgs/arc/staging/spack
  view: false
  specs:
  ##########################################################################################
  #                                       Software                                         #
  ##########################################################################################
  - group: test
    specs:
    - build-link-test ^netcdf-c@4.7.4~mpi~parallel-netcdf~hdf4 ^hdf5@1.14.6+cxx+fortran+hl~ipo~java~map~mpi+shared+szip~threadsafe+tools ^libaec@1.1.4
    override:
      packages:
        c:
          prefer: [gcc@8.5.0]
        cxx:
          prefer: [gcc@8.5.0]
        fortran:
          prefer: [gcc@8.5.0]
        pkgconf:
          require:
            - "target=x86_64"  
  concretizer:
    unify: false
    reuse: true
  packages:
    perl:
      externals:
      - spec: perl@5.26.3
        prefix: /usr
    icu4c:
      buildable: false
      externals:
      - spec: icu4c@60.3
        prefix: /usr
    openjdk:
      buildable: false
      externals:
      - spec: openjdk@1.8.0
        prefix: /usr/lib/jvm/jre
      - spec: openjdk@18.0.1.1
        prefix: /sw/pkgs/arc/openjdk/jdk-18.0.1.1
    autoconf:
      buildable: false
      externals:
      - spec: autoconf@2.69
        prefix: /usr
    pkgconf:
      buildable: false
      externals:
      - spec: pkgconf@2.5.1
        prefix: /usr
    openssl:
      buildable: false
      externals:
      - spec: openssl@1.1.1
        prefix: /usr
    tar:
      buildable: false
      externals:
      - spec: tar@1.30
        prefix: /usr
  modules:
    default:
      roots:
        lmod: /sw/pkgs/arc/staging/spack/modules
        tcl: /sw/pkgs/arc/staging/spack/modules
      lmod:
        projections:
          r: 'R/{version}'
          intel-oneapi-compilers-classic: 'intel/{version}'
        hash_length: 0
        hierarchy:
          - r
          - mpi
        core_specs:
        - gcc@8.5.0
        - gcc-runtime@8.5.0
        - gcc@10.3.0
        - gcc@15.1.0
        - llvm@22.1.3
        - intel-oneapi-compilers-classic@2021.5.0
        exclude:
        - gcc-runtime@8.5.0
        - glibc
        - autoconf
        - compiler-wrapper
        - util-macros