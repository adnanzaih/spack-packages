# This is a Spack Environment file.
#
# It describes a set of packages to be installed, along with
# configuration settings.
spack:
  config:
      install_tree:
        root: /sw/spack/opt/pkgs
  view: false
  specs:
  ##########################################################################################
  #                                       Software                                         #
  ##########################################################################################

  - group: Base-GCC14-Compiler
    specs:
    - argtable cflags="-Wno-error=implicit-function-declaration"
    - gcc@14.3.1/o4xno4x
    - python@3.14.7
    - python@3.13.13
    - python@3.9.24
    - python@3.10.19
    - miniforge3@26.3.2-3+notebook+pytorch pytorch-cuda=13
    - armadillo ^flexiblas
    - flexiblas@3.4.2
    - boost@1.90.0~mpi
    - boost@1.89.0~mpi
    - geos@3.14.1
    - openmpi@5.0.10
    - openblas@0.3.33
    - netlib-lapack@3.12.1
    - libaec@1.1.4
    - libxcrypt+obsolete_api
    - proj@9.7.0 ^libtiff@4.7.1
    - hdf5@1.14.6+cxx+fortran+hl+threadsafe~mpi ^libaec@1.1.4
    - hdf5@1.14.6+cxx+fortran+hl+threadsafe+mpi ^libaec@1.1.4
    - hdf5@2.1+cxx+fortran+hl+threadsafe~mpi ^libaec@1.1.4
    - netcdf-c+blosc+hdf4+mpi+parallel-netcdf+szip+zstd+jna ^hdf5@1.14.6+cxx+fortran+hl+threadsafe+mpi ^libaec@1.1.4
    - netcdf-cxx4 ^hdf5@1.14.6+cxx+fortran+hl+threadsafe+mpi ^libaec@1.1.4
    - netcdf-fortran ^hdf5@1.14.6+cxx+fortran+hl+threadsafe+mpi ^libaec@1.1.4
    - libjpeg-turbo@3.1.3
    - libtiff@4.7.1
    - sqlite@3.53.1
    #- archivetar@0.18.2 ^python@3.13.13 ^openmpi@5.0.10
    - libsodium@1.0.22
    - libgd@2.3.3
    - r@4.6.1
    - r@4.5.3
    - r@4.3.1+X+arc
    - py-mpi4py ^python@3.13.13 ^openmpi@5.0.10
    - fiji@2026.03.07
    - cuda@13
    - fftw+mpi
    - ffmpeg@8.1+X+bzlib~doc+drawtext+gpl+libaom+libmp3lame+libopenjpeg~libopus~libsnappy~libspeex~libssh~libvorbis~libvpx+libwebp~libx264+libxml2+libzmq+lzma~nonfree~openssl~sdl2+shared+version3
    - mumps +complex+double+float+metis+parmetis+scotch+mpi
    - ruby
    - julia cpu_target=znver5
    - lammps+mpi+lib+jpeg+png+ffmpeg+openmp+opencl+kspace~kokkos+h5md+spin %gcc@14.3.1 ^ffmpeg/ipusu3b
    - gromacs+cuda+mpi %gcc@14.3.1
    - quantum-espresso %gcc@14.3.1 ^fftw/q2kkuso
    - rclone 
    - jags
    - nco ^netcdf-c~mpi~parallel-netcdf ^hdf5~mpi@1.14.6
    - pgplot
    - ncview ^libxaw@1.0.15 ^netcdf-c~mpi~parallel-netcdf ^hdf5~mpi@1.14.6
    - gh
    - nvtop
    override:
      packages:
        c:
          prefer: [gcc@14.3.1]
        cxx:
          prefer: [gcc@14.3.1]
        fortran:
          prefer: [gcc@14.3.1]
        python:
          require:
          - "+arc"
        openmpi:
          require:
          - "+arc"
        r:
          require:
          - "+arc+X"
        hdf5:
          prefer:
          - "@2.1"
          - "+cxx+fortran+hl+mpi"
        boost:
          prefer:
          - "~mpi"
  - group: compilers
    specs:
    - intel-oneapi-compilers-classic@2021.13.1
    - intel-oneapi-mpi@2021.18.0
    - aocc@5.2.0 +license-agreed
    - nvhpc@26.5
    - llvm/ganxupa ^python@3.10.19 
    - gcc@10.3.0+binutils
    - gcc@12.3.0+binutils
    - go ^gcc/o4xno4x
    - rust
    override:
      packages:
        c:
          prefer: [gcc@14.3.1]
        cxx:
          prefer: [gcc@14.3.1]
        fortran:
          prefer: [gcc@14.3.1]
        python:
          require:
          - "+arc"
        openmpi:
          require:
          - "+arc"
  - group: imaging
    specs:
    - freesurfer
    - vtk
    - fsl@6.0.5.2+cuda cuda_arch=80 ^openblas@0.3.33
  concretizer:
    unify: false
    reuse: true
    ##########################################################################################
    #                                         Modules                                        #
    ##########################################################################################
  modules:
    default:
      roots:
        lmod: /sw/spack/opt/modules
        tcl: /sw/spack/opt/modules
      lmod:
        projections:
          r: 'R/{version}'
          hdf5~threadsafe: 'hdf5/{version}-nonatomic'
          intel-oneapi-compilers-classic: 'intel/{version}'
          miniforge3: 'mamba/{version}'
          py-mpi4py: 'mpi4py/{version}'
          intel-oneapi-mpi: 'impi/{version}'
          gh: 'github-cli/{version}'
        hash_length: 0
        all:
          suffixes:
            'binutils target=x86_64': x86_64
            'gmp target=x86_64': x86_64
            'mpc target=x86_64': x86_64
            'mpfr target=x86_64': x86_64
            'zlib-ng target=x86_64': x86_64
            'zstd target=x86_64': x86_64
        core_compilers:
          - gcc@14.3.1
        hierarchy:
          - r
          - mpi
        core_specs:
        - gcc@14.3.1
        - gcc-runtime@14.3.1
        exclude:
        - gcc-runtime@14.3.1
        - glibc
        - autoconf
        - compiler-wrapper
        - util-macros
        - py-pip
        - py-setuptools
        - py-wheel
        - py-cython
        - python-venv
        gcc-runtime:
          template: gcc-runtime.lua
        miniforge3:
          environment:
            set:
              CONDA_ENVS_PATH: "~/.conda/envs"
              CONDA_PKGS_DIRS: "~/.conda/pkgs"
        openmpi@5.0.10+arc:
          environment:
            set:
              UCX_LOG_LEVEL: error
        intel-oneapi-mpi@2021.18.0:
          environment:
            set:
              SLURM_MPI_TYPE: pmi2
              I_MPI_HYDRA_BOOSTRAP: slurm
              I_MPI_PMI_LIBRARY: /usr/lib64/libpmi2.so
        aocc@5.2.0:
          environment:
            prepend_path:
              MODULEPATH: /sw/spack/chemistry/opt/modules/linux-rhel10-x86_64/aocc/5.2.0
