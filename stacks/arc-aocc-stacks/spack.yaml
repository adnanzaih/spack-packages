# This is a Spack Environment file.
#
# It describes a set of packages to be installed, along with
# configuration settings.
spack:
  config:
      install_tree:
        root: /sw/spack/opt/pkgs
  view: false
  specs:
  ##########################################################################################
  #                                       Software                                         #
  ##########################################################################################

  - group: Base-AOCC-Compiler
    specs:
    - python@3.13.13
    - python@3.14.7 %aocc@5.2.0
    - armadillo ^flexiblas
    - flexiblas@3.4.2
    - boost@1.90.0~mpi
    - geos@3.14.1
    - openmpi@5.0.10
    - openblas@0.3.33 %aocc@5.2.0
    - netlib-lapack@3.12.1
    - libaec@1.1.4
    - proj@9.7.0 ^libtiff@4.7.1
    - hdf5@1.14.6+cxx+fortran+hl+threadsafe~mpi ^libaec@1.1.4
    - hdf5@1.14.6+threadsafe ^libaec@1.1.4
    - netcdf-c+blosc+hdf4+mpi+parallel-netcdf+szip+zstd
    - netcdf-cxx4 
    - netcdf-fortran
    - libjpeg-turbo@3.1.3
    - libtiff@4.7.1
    - sqlite@3.53.1
    - archivetar@0.18.2 ^python@3.13.13 ^openmpi@5.0.10
    - libsodium@1.0.22
    - r@4.6.1 %c,cxx=aocc@5.2.0 %fortran=gcc@14.3.1 ^flexiblas/xs4rhnv # gcc flexiblas
    - r@4.5.3 %c,cxx=aocc@5.2.0 %fortran=gcc@14.3.1 ^flexiblas/xs4rhnv # gcc flexiblas
    - mumps +complex+double+float+metis+parmetis+scotch+mpi
    - ffmpeg@8.1+X+bzlib~doc+drawtext+gpl+libaom+libmp3lame+libopenjpeg~libopus~libsnappy~libspeex~libssh~libvorbis~libvpx+libwebp~libx264+libxml2+libzmq+lzma~nonfree~openssl~sdl2+shared+version3
    - fftw+mpi %aocc@5.2.0
    - lammps+mpi+lib+jpeg+png+ffmpeg+openmp+opencl+kspace~kokkos+h5md+spin %aocc@5.2.0 ^ffmpeg/avaqiff
    #- gromacs+cuda+mpi %aocc@5.2.0
    - quantum-espresso %aocc@5.2.0 ^fftw/o2447w4
    override:
      packages:
        c:
          prefer: [aocc@5.2.0]
        cxx:
          prefer: [aocc@5.2.0]
        fortran:
          prefer: [aocc@5.2.0]
        python:
          require:
          - "+arc"
        openmpi:
          require:
          - "+arc"
        r:
          require:
          - "+arc+X"
        hdf5:
          prefer:
          - "+cxx+fortran+hl+mpi"
        boost:
          prefer:
          - "~mpi"
  concretizer:
    unify: false
    reuse: true
    compiler_mixing: true
    ##########################################################################################
    #                                         Modules                                        #
    ##########################################################################################
  modules:
    default:
      roots:
        lmod: /sw/spack/opt/modules
        tcl: /sw/spack/opt/modules
      lmod:
        projections:
          r: 'R/{version}'
          hdf5~threadsafe: 'hdf5/{version}-nonatomic'
          intel-oneapi-compilers-classic: 'intel/{version}'
          miniforge3: 'mamba/{version}'
          py-mpi4py: 'mpi4py/{version}' 
        hash_length: 0
        core_compilers:
          - gcc@14.3.1
        hierarchy:
          - r
          - mpi
        filter_hierarchy_specs:
          archivetar:
            - mpi
        archivetar:
          autoload: none
        core_specs:
        - gcc@14.3.1
        - gcc-runtime@14.3.1
        - aocc@5.2.0
        exclude:
        - gcc-runtime@14.3.1
        - glibc
        - autoconf
        - compiler-wrapper
        - util-macros
        - py-pip
        - py-setuptools
        - py-wheel
        - py-cython
        - python-venv
        gcc-runtime:
          template: gcc-runtime.lua
        openmpi@5.0.10+arc:
          environment:
            set:
              UCX_LOG_LEVEL: error
