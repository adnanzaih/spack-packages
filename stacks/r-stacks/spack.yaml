# This is a Spack Environment file.
#
# It describes a set of packages to be installed, along with
# configuration settings.
spack:
  config:
      install_tree:
        root: /sw/pkgs/arc/staging/spack
  view: false
  specs:
  ##########################################################################################
  #                                       Software                                         #
  ##########################################################################################
  - group: R stacks for gcc-8, gcc-10 and gcc-15
    specs:
      - matrix:
        - 
          - rtidyverse@2.0.0 ^r@4.5.3
          - rgeospatial@1.5-18 ^r@4.5.3 ^rtidyverse@2.0.0 ^gdal ^poppler@21.09.0 ^proj@9.7.0 ^geos@3.14.1 ^netcdf-fortran@4.6.2 ^hdf5@1.14.6 ^openjdk@18.0.1.1
          - rtidyverse@2.0.0 ^r@4.6.0
          - rgeospatial@1.5-18 ^r@4.6.0 ^rtidyverse@2.0.0 ^gdal ^poppler@21.09.0 ^proj@9.7.0 ^geos@3.14.1 ^netcdf-fortran@4.6.2 ^hdf5@1.14.6 ^openjdk@18.0.1.1
        - - "%gcc@8.5.0"
          - "%gcc@10.3.0"
          - "%gcc@15.1.0"
    override:
      packages:
        python:
          require:
          - "+arc"
        openmpi:
          require:
          - "+arc"
        r:
          require:
          - "+arc"
        gdal:
          require:
          - "+armadillo+blosc+arrow+hdf4+hdf5+liblzma+libxml2+poppler+parquet+libaec+zstd"
          - spec: "@3.8.5"
            when: "%gcc@8.5.0"
          - spec: "@3.13.2"
            when: "%gcc@10.3.0:"
        arrow:
          require:
          - "+bz2+hdfs+ipc+mimalloc~orc+parquet~python+shared~snappy+zlib+zstd"
        json-c:
          prefer: 
          - "@0.14:"
  concretizer:
    unify: false
    reuse: true
  packages:
  ##########################################################################################
  #                                       Compilers                                        #
  ##########################################################################################
    all:
      providers:
        java: [openjdk]
    gcc:
      externals:
      - spec: gcc@8.5.0 languages:='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc
            cxx: /usr/bin/g++
            fortran: /usr/bin/gfortran
      - spec: gcc@10.3.0 languages:='c,c++,fortran'
        prefix: /sw/pkgs/arc/gcc/10.3.0
        extra_attributes:
          compilers:
            c: /sw/pkgs/arc/gcc/10.3.0/bin/gcc
            cxx: /sw/pkgs/arc/gcc/10.3.0/bin/g++
            fortran: /sw/pkgs/arc/gcc/10.3.0/bin/gfortran
      - spec: gcc@15.1.0 languages:='c,c++,fortran'
        prefix: /sw/pkgs/arc/gcc/15.1.0
        extra_attributes:
          compilers:
            c: /sw/pkgs/arc/gcc/15.1.0/bin/gcc
            cxx: /sw/pkgs/arc/gcc/15.1.0/bin/g++
            fortran: /sw/pkgs/arc/gcc/15.1.0/bin/gfortran
    ##########################################################################################
    #                                       Externals                                        #
    ##########################################################################################
    perl:
      externals:
      - spec: perl@5.26.3
        prefix: /usr
    icu4c:
      buildable: false
      externals:
      - spec: icu4c@60.3
        prefix: /usr
    openjdk:
      buildable: false
      externals:
      - spec: openjdk@1.8.0
        prefix: /usr/lib/jvm/jre
      - spec: openjdk@18.0.1.1
        prefix: /sw/pkgs/arc/openjdk/jdk-18.0.1.1
    autoconf:
      buildable: false
      externals:
      - spec: autoconf@2.69
        prefix: /usr
    pkgconf:
      buildable: false
      externals:
      - spec: pkgconf@2.5.1
        prefix: /usr
    openssl:
      buildable: false
      externals:
      - spec: openssl@1.1.1
        prefix: /usr
    tar:
      buildable: false
      externals:
      - spec: tar@1.30
        prefix: /usr
    curl:
      buildable: true
      externals:
      - spec: curl@7.61.1
        prefix: /usr
    expat:
      buildable: false
      externals:
      - spec: expat@2.5.0
        prefix: /usr
    json-c:
      buildable: True
      externals:
      - spec: json-c@0.13.1
        prefix: /usr
    readline:
      buildable: false
      externals:
      - spec: readline@7.0
        prefix: /usr
    hwloc:
      buildable: false
      externals:
      - spec: hwloc@2.1.0
        prefix: /usr
    pmix:
      buildable: false
      externals:
      - spec: pmix@5.0.10
        prefix: /opt/pmix/5.0.10
    ##########################################################################################
    #                                         Modules                                        #
    ##########################################################################################

  modules:
    default:
      roots:
        lmod: /sw/pkgs/arc/staging/spack/modules
        tcl: /sw/pkgs/arc/staging/spack/modules
      lmod:
        projections:
          r: 'R/{version}'
          intel-oneapi-compilers-classic: 'intel/{version}'
        hash_length: 0
        core_compilers:
          - gcc@8.5.0
        hierarchy:
          - r
          - mpi
        core_specs:
        - gcc@8.5.0
        - gcc-runtime@8.5.0
        - gcc@10.3.0
        - gcc@15.1.0
        - llvm@22.1.3
        - intel-oneapi-compilers-classic@2021.5.0
        exclude:
        - gcc-runtime@8.5.0
        - glibc
        - autoconf
        - compiler-wrapper
        - util-macros